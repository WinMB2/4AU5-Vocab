const scoresKey='yummyFoodScoresV3';
const modes=['learn','recognize','spell','world'];
const countries=['China','France','Greece','India','Indonesia','Italy','Japan'];
let student='',mode='learn',order=[],index=0,answered=false,mistakes=0,recorder=null,stream=null,recognition=null,recording=false,recordSession=0,transcript='',clip=null,timeoutId=null;
const panel=document.getElementById('panel');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
const clean=s=>String(s||'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
function load(){try{return JSON.parse(localStorage.getItem(scoresKey))||{}}catch(e){return {}}}
function save(v){try{localStorage.setItem(scoresKey,JSON.stringify(v))}catch(e){}}
function empty(){return {learn:0,recognize:0,spell:0,world:0,readBest:{},done:{recognize:{},spell:{},world:{}},updated:Date.now()}}
function entry(){return load()[student]||empty()}
function total(e){return modes.reduce((n,k)=>n+(e[k]||0),0)}
function award(stage,food,pts){let db=load(),e=db[student]||empty();if(stage==='learn'){let old=e.readBest[food]||0;if(pts>old){e.readBest[food]=pts;e.learn+=pts-old}}else{e.done=e.done||{};e.done[stage]=e.done[stage]||{};if(!e.done[stage][food]){e.done[stage][food]=true;e[stage]+=pts}}e.updated=Date.now();db[student]=e;save(db);bar()}
function bar(){if(!student)return;let e=entry();$('player').innerHTML='<div class="player"><strong>👤 '+esc(student)+'</strong><strong>⭐ My points: '+total(e)+' / 360</strong><button class="btn alt" id="switch" style="padding:5px 11px;font-size:14px">Change name</button></div>';$('switch').onclick=()=>{stop();student='';$('nav').classList.add('hide');start()};}
function start(){ $('player').innerHTML='';panel.innerHTML='<div class="start"><h2>👋 Hello!</h2><p>What is your name?</p><p><input id="studentName" maxlength="30" placeholder="Type your name" autocomplete="off" aria-label="Your name"></p><p class="alert" id="err"></p><button class="btn" id="go">Start Game ▶</button><p class="small">Learn 9 food words. Win points!</p></div>';$('go').onclick=login;$('studentName').onkeydown=e=>{if(e.key==='Enter')login()}}
function login(){let name=$('studentName').value.trim().replace(/\s+/g,' ');if(!name){$('err').textContent='Please type your name.';return}student=name;let db=load();if(!db[student]){db[student]=empty();save(db)}$('nav').classList.remove('hide');bar();begin('learn')}
function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.78;let voices=window.speechSynthesis.getVoices();let preferred=voices.find(v=>v.lang.toLowerCase().startsWith('en')&&/female|samantha|victoria|zira|aria|google uk english female/i.test(v.name));if(preferred)u.voice=preferred;window.speechSynthesis.speak(u)}
function stop(){recordSession++;recording=false;clearTimeout(timeoutId);try{recognition?.abort()}catch(e){}try{if(recorder?.state==='recording')recorder.stop()}catch(e){}try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;recognition=null;recorder=null;}
function begin(m){stop();mode=m;index=0;answered=false;mistakes=0;order=m==='learn'?foods.slice():shuffle(foods);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='board')board();else render()}
function progress(){return '<div class="progress">Word '+(index+1)+' of '+foods.length+'</div>'}
function img(f){return '<img class="photo" src="'+esc(f.image)+'" alt="'+esc(f.name)+'" referrerpolicy="no-referrer" onerror="this.onerror=null;this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<p class=small>Photo unavailable. Please check your internet connection.</p>\')">'}
function next(){stop();if(index+1>=foods.length){finish();return}index++;answered=false;mistakes=0;render()}
function render(){let f=order[index];if(mode==='learn')learn(f);if(mode==='recognize')recognize(f);if(mode==='spell')spell(f);if(mode==='world')world(f)}
function finish(){let e=entry();panel.innerHTML='<h2>🎉 Well done!</h2><p class="sub">You finished this game!</p><div class="scorebar">'+modes.map(k=>'<span>'+k+': '+e[k]+'/90</span>').join('')+'</div><h2>⭐ '+total(e)+' / 360 points</h2><div class="actions"><button class="btn" id="viewBoard">See Scores 🏆</button><button class="btn alt" id="again">Play Again</button></div>';$('viewBoard').onclick=()=>begin('board');$('again').onclick=()=>begin(mode)}
function readScore(expected,heard){let a=clean(expected),b=clean(heard);if(!b)return 0;if(a===b)return 10;let parts=a.split(' '),got=b.split(' '),hits=parts.filter(w=>got.includes(w)).length;if(hits===parts.length)return 9;if(hits>0)return Math.min(8,Math.max(3,Math.round(10*hits/parts.length)));return 0}
function learn(f){let prior=entry().readBest?.[f.name]||0;panel.innerHTML='<h2>🎙️ Listen and Say</h2><p class="sub">Listen. Say the food word.</p>'+progress()+img(f)+'<div class="foodname">'+esc(f.name)+'</div><div class="actions"><button class="btn alt" id="listen">🔊 Listen</button><button class="btn" id="record">🎙️ Record My Voice</button><button class="btn alt" id="playclip" disabled>▶ My Voice</button></div><p class="mic" id="mic">Your best score: '+prior+' / 10</p><p class="small" id="heard">Tap the microphone and say the word.</p><p class="small">Your voice is checked by speech recognition. It is not a teacher\'s pronunciation grade.</p><div class="actions"><button class="btn alt" id="previous" '+(index===0?'disabled':'')+'>← Back</button><button class="btn ok" id="advance" '+(prior>0?'':'disabled')+'>Next →</button></div>';$('listen').onclick=()=>speak(f.name);$('record').onclick=()=>record(f);$('previous').onclick=()=>{stop();index--;render()};$('advance').onclick=next}
async function record(f){if(recording){finishRecord(f);return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('mic').textContent='Speech check is not available here. Please use Chrome or Edge.';return}if(!navigator.mediaDevices?.getUserMedia){$('mic').textContent='Microphone is not available. Use a secure web page (HTTPS).';return}stop();recording=true;transcript='';let session=recordSession;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(session!==recordSession){stream.getTracks().forEach(t=>t.stop());return}if(window.MediaRecorder){let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(chunks.length&&session===recordSession){if(clip)URL.revokeObjectURL(clip);clip=URL.createObjectURL(new Blob(chunks,{type:chunks[0].type||'audio/webm'}));$('playclip').disabled=false;$('playclip').onclick=()=>new Audio(clip).play()}};recorder.start()}
recognition=new SR();recognition.lang='en-GB';recognition.interimResults=true;recognition.continuous=false;recognition.onresult=e=>{if(session!==recordSession)return;transcript=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();$('heard').textContent='I heard: '+transcript};recognition.onerror=e=>{if(session===recordSession){$('mic').textContent='Please try again. ('+e.error+')';finishRecord(f,true)}};recognition.onend=()=>{if(session===recordSession&&recording)finishRecord(f)};recognition.start();$('record').textContent='⏹ Stop';$('mic').textContent='🔴 Speak now!';timeoutId=setTimeout(()=>{if(session===recordSession&&recording)finishRecord(f)},8500)
}catch(e){if(session===recordSession){finishRecord(f,true);$('mic').textContent='Please allow the microphone and try again.'}}}
function finishRecord(f,failed=false){if(!recording)return;recording=false;clearTimeout(timeoutId);let pts=failed?0:readScore(f.name,transcript);try{recognition?.stop()}catch(e){}try{if(recorder?.state==='recording')recorder.stop()}catch(e){}try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}let prev=entry().readBest?.[f.name]||0;if(pts>prev)award('learn',f.name,pts);$('record').textContent='🎙️ Try Again';$('mic').textContent='⭐ This try: '+pts+'/10 · Best: '+Math.max(pts,prev)+'/10';$('heard').textContent='I heard: '+(transcript||'(no words heard)');$('advance').disabled=Math.max(pts,prev)===0;}
function options(correct,pool){return shuffle([correct,...shuffle(pool.filter(v=>v!==correct)).slice(0,3)])}
function choose(f,kind,title,prompt,candidates,showName){panel.innerHTML='<h2>'+title+'</h2><p class="sub">'+prompt+'</p>'+progress()+img(f)+(showName?'<div class="foodname">'+esc(f.name)+'</div>':'')+'<div class="choices">'+options(kind==='recognize'?f.name:f.country,candidates).map(v=>'<button class="choice" data-value="'+esc(v)+'">'+(kind==='world'?flag(v)+' ':'')+esc(v)+'</button>').join('')+'</div><p class="feedback" id="feedback"></p><div class="actions" id="continue"></div>';panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let expected=kind==='recognize'?f.name:f.country;let good=b.dataset.value===expected;b.classList.add(good?'correct':'wrong');panel.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.dataset.value===expected)x.classList.add('correct')});if(good)award(kind,f.name,10);$('feedback').textContent=(good?'✅ Great!':'💡 Try again next time!')+' Answer: '+expected+(kind==='world'?'. '+f.detail:'');$('continue').innerHTML='<button class="btn ok" id="advance">Next →</button>';$('advance').onclick=next;if(kind==='recognize')speak(f.name)})}
function recognize(f){choose(f,'recognize','👀 Look and Choose','Look at the photo. Pick the food word.',foods.map(x=>x.name),false)}
function spell(f){let hint=f.name.split(' ').map(w=>w[0]+' '+Array(Math.max(0,w.length-1)).fill('_').join(' ')).join('  /  ');panel.innerHTML='<h2>✏️ Spell the Word</h2><p class="sub">Look. Listen. Type the word.</p>'+progress()+img(f)+'<div class="letters">'+esc(hint)+'</div><div class="spell"><div class="actions"><button class="btn alt" id="listen">🔊 Listen</button></div><input id="guess" aria-label="Food word" placeholder="Type the food word" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="actions"><button class="btn" id="check">Check ✓</button></div></div><p class="feedback" id="feedback"></p><div class="actions" id="continue"></div>';$('listen').onclick=()=>speak(f.name);$('check').onclick=check;$('guess').onkeydown=e=>{if(e.key==='Enter')check()};function check(){if(answered)return;if(clean($('guess').value)===f.name){answered=true;if(!mistakes)award('spell',f.name,10);$('feedback').textContent='✅ Good job! '+f.name+'.';$('guess').disabled=true;$('check').disabled=true;$('continue').innerHTML='<button class="btn ok" id="advance">Next →</button>';$('advance').onclick=next;speak(f.name)}else{mistakes++;$('feedback').textContent=mistakes>=2?'Try again! Hint: '+f.name:'Try again! Look at the first letters.';$('guess').focus()}}}
function flag(s){return {'China':'🇨🇳','France':'🇫🇷','Greece':'🇬🇷','India':'🇮🇳','Indonesia':'🇮🇩','Italy':'🇮🇹','Japan':'🇯🇵'}[s]||'🌍'}
function world(f){choose(f,'world','🌍 Food Around the World','Which country is famous for this food?',countries,true)}
function board(){let db=load(),rows=Object.entries(db).map(([name,e])=>({name,...e,total:total(e)})).sort((a,b)=>b.total-a.total||(a.updated||0)-(b.updated||0));panel.innerHTML='<h2>🏆 Top Scores</h2><p class="sub">Look at your points!</p><div class="scorebar">'+modes.map(k=>'<span>'+k+': '+(entry()[k]||0)+'/90</span>').join('')+'</div><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Name</th><th>Say</th><th>Look</th><th>Spell</th><th>World</th><th>Total</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr class="'+(r.name===student?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+(r.learn||0)+'</td><td>'+(r.recognize||0)+'</td><td>'+(r.spell||0)+'</td><td>'+(r.world||0)+'</td><td><strong>'+r.total+'</strong></td></tr>').join('')+'</tbody></table></div><p class="small">You can get up to 10 points for each word in each game. Scores are saved on this device only.</p><div class="actions"><button class="btn" id="play">Play Again ▶</button></div>';$('play').onclick=()=>begin('learn')}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(student)begin(b.dataset.mode)});start();
</script></body></html>
